<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>QA Job Hunter — Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar__brand">
      <span class="logo">QA Job Hunter</span>
      <span class="subtitle">Dashboard de empleos</span>
    </div>
    <div class="top-bar__right">
      <nav class="site-nav" aria-label="Principal">
        <a class="site-nav__link" href="/" aria-current="page" data-testid="nav-link-dashboard">Dashboard</a>
        <a class="site-nav__link" href="/tracker" data-testid="nav-link-tracker">Tracker</a>
        <a class="site-nav__link" href="/run" data-testid="nav-link-run">Ejecutar</a>
        <a class="site-nav__link" href="/config" data-testid="nav-link-config">Configuración</a>
      </nav>
      <div class="top-bar__stats" id="header-stats"></div>
    </div>
  </header>
  <div id="banner-assessment" class="banner-assessment hidden" role="status" aria-live="polite" hidden data-testid="banner-assessment"></div>
  <div id="app-flash" class="app-flash hidden" role="status" aria-live="polite" hidden></div>
  <main class="layout">
    <section class="panel panel--detail" aria-label="Detalle del empleo">
      <div id="detail-empty" class="empty-state"><p>Selecciona un empleo de la lista para ver el detalle.</p></div>
      <article id="detail-content" class="detail hidden" hidden></article>
    </section>
    <aside class="panel panel--list" aria-label="Lista de empleos">
      <div class="list-header">
        <h2>Empleos con match</h2>
        <label class="sort-control">
          <span>Ordenar</span>
          <select id="sort-select" aria-label="Ordenar por porcentaje de match">
            <option value="desc">Mayor match primero</option>
            <option value="asc">Menor match primero</option>
          </select>
        </label>
        <div class="list-dropdown-filters" aria-label="Filtrar por empresa y puesto">
          <label class="sort-control">
            <span>Empresa</span>
            <select id="filter-company" data-testid="dash-filter-company" aria-label="Filtrar por empresa">
              <option value="">Todas</option>
            </select>
          </label>
          <label class="sort-control">
            <span>Puesto</span>
            <select id="filter-title" data-testid="dash-filter-title" aria-label="Filtrar por puesto">
              <option value="">Todos</option>
            </select>
          </label>
        </div>
        <div class="list-filters" aria-label="Filtrar lista">
          <label class="filter-control" data-filter-bucket="unmarked">
            <input type="checkbox" id="show-unmarked" checked />
            <span class="filter-label" data-filter-label="unmarked">Sin Clasificar</span>
          </label>
          <label class="filter-control" data-filter-bucket="applied">
            <input type="checkbox" id="show-applied" />
            <span class="filter-label" data-filter-label="applied">Aplicados</span>
          </label>
          <label class="filter-control" data-filter-bucket="not_applied">
            <input type="checkbox" id="show-not-applied" />
            <span class="filter-label" data-filter-label="not_applied">No aplicados</span>
          </label>
          <label class="filter-control" data-filter-bucket="not_selected">
            <input type="checkbox" id="show-not-selected" />
            <span class="filter-label" data-filter-label="not_selected">No seleccionada/o</span>
          </label>
          <label class="filter-control" data-filter-bucket="assessment">
            <input type="checkbox" id="show-assessment" data-testid="dash-filter-assessment" />
            <span class="filter-label" data-filter-label="assessment">Assessment pendiente</span>
          </label>
          <label class="filter-control" data-filter-bucket="assessment_done">
            <input type="checkbox" id="show-assessment-done" data-testid="dash-filter-assessment-done" />
            <span class="filter-label" data-filter-label="assessment_done">A-realizado</span>
          </label>
          <label class="filter-control" data-filter-bucket="rejected">
            <input type="checkbox" id="show-rejected" />
            <span class="filter-label" data-filter-label="rejected">Match incorrecto</span>
          </label>
          <label class="filter-control" data-filter-bucket="closed">
            <input type="checkbox" id="show-closed" />
            <span class="filter-label" data-filter-label="closed">Cerrado</span>
          </label>
          <label class="filter-control" data-filter-bucket="duplicated">
            <input type="checkbox" id="show-duplicated" data-testid="dash-filter-duplicated" />
            <span class="filter-label" data-filter-label="duplicated">Duplicado</span>
          </label>
        </div>
      </div>
      <ul id="job-list" class="job-list"></ul>
      <div id="list-empty" class="empty-state hidden" hidden>
        <p>No hay empleos con 70%+ de match.</p>
        <p class="hint">Ejecuta: <code>npx tsx src/3-analyze-match.ts</code></p>
      </div>
      <div id="list-error" class="empty-state error hidden" hidden></div>
    </aside>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
